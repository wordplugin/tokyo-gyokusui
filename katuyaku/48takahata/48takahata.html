<p class="top-text">
高畑淳子（たかはた　あつこ）<br>
高松高校　昭和48年卒<br>
劇団青年座所属</p>

<h4>プロフィール</h4>
<p class="main-text">
1973年　桐朋学園大学短期大学部芸術科入学<br>
卒業後、劇団青年座に入団<br>
『仮面ライダーBLACK RX』の悪役・マリバロンが当たり役に。<br>
その後、「３年Ｂ組金八先生」、ＮＨＫ大河ドラマ「毛利元就」などに出演。<br>
舞台、テレビなどで大活躍。<br>

<a href="http://www.umako.info/">高畑淳子オフィシャルページはこちら</a>

</p>
