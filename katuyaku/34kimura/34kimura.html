高松高校　昭和34年卒<br>
2018年(H29)8月ご逝去
(Last updated:2019.2)</p>
<h4>プロフィール</h4>
<p class="main-text">
1965年　東京芸大・油画科山口教室卒業<br>
1967年　東京芸大大学院・壁画専攻終了<br>
香川大学教授（洋画）<br>
公益財団法人よんでん文化振興財団評議員<br>

</p>

<h4>展覧会</h4>
<p class="main-text">
毎年、昭和60年代に東京芸大の林武、小磯良平らの教室で学んだ７人の画家によるグループ展（アカンサス展）を東京で開催している。
</p>
