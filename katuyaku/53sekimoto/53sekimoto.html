高松高校　昭和53年卒<br>
(Last updated:1998.8)</p>

<h4>プロフィール</h4>
<p class="main-text">
香川県高松市在住　歯科医のかたわら、アマチュアのJAZZ BAND "Swingin' Wonderland Jazz Orchestra(SWJO)"を結成し、JAZZ文化の普及につとめる。<br>
平成８年、高松市文化奨励賞を受賞。<br>
バンドのメンバーには高高出身者も多い。
