<h3>
《　　第45回高高神田会　　》</h3>
<h2 class="title">「重ね正月」に白みそ餡餅雑煮を<br>
いただき、厄落としをする会</h2>
</div>

<div id="main">
　「重ね正月」2月1日に、神田会恒例「白みそ餡餅雑煮会」が今年も新橋はせとうち旬彩館「かおりひめ」にて開催されました。<br>

　参加者は、約60名。毎年、立派な餡餅や雑煮の材料を送って下さる平成3年卒佐治さんのご実家に今年もすっかり甘えて、懐かしい郷土の味、白みそ餡餅雑煮やさぬきおでん、まんばのけんちゃん、さぬきうどん等々に舌鼓を打ちました。<br>
