<h2 class="title">仲秋の名月に 古都鎌倉の風 を感じる会<br>
「第５回　仲秋コンサート in 東慶寺」</h2>
</div>

<div id="main">
　２００６年(H18)１０月９日、<font color="#0000FF">藤原清登さん（ベース：Ｓ４７年卒）</font>、<font color="#0000FF">白川真理さん（フルート：Ｓ５２年卒）</font>、<font color="#0000FF">小濱明人さん（尺八奏者：H６年卒）</font>を迎えて、鎌倉東慶寺で第５回仲秋コンサートが開かれました。<br><br>
　この日は、白川さんが演奏する天平の音色「江平の笛」に興味を持ったＮＨＫが取材に来ていました。<br>
