<font size="5" color="#F00000">「第９回　キャンドルコンサート ｉｎ 東慶寺」</font><br>
<font size="5" color="#808000">～古刹の本堂　ロウソクのほのかな灯の下に「フルートによる源氏物語」と「ベースによる平家物語」を楽しみ　古戦場屋島の近くで育った住職夫人と共に<br>
２１世紀の源平合戦　東慶寺コンサートを楽しむ会～</font>

</div>
