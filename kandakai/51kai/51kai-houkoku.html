《　第51回高高神田会　》</h3>

<h2 class="title">第16回　あん餅雑煮新年会</h2>
</div>

<div id="main">
<p style="text-align:left;">2017年(H29)2月11日 今年も香川県東京事務所のご協力により、せとうち旬彩館『かおりひめ』において神田会新年会が開かれました。<br>
参加者は約90名で過去最高を記録。<br>

今年の総会幹事の平成5年卒の皆さんも参加し、総会への決意を語ってくれました。<br>
</p>
