<h3>
《　　第44回高高神田会　　》</h3>
<h2 class="title">第１２回 半月の夜のコンサート in 東慶寺<br>

～ 今年も例年通り開催することができました ～
</h2>
</div>

<div id="main">
2013年(H25)11月9日(土)、第12回半月の夜のコンサートin東慶寺が開かれました。<br>

東慶寺のご住職で、井上米輝子さん(45年卒)のご主人でもあった井上正道氏がご逝去され、東慶寺コンサートの開催をどうするか思い悩んでいましたが、井上米輝子さんのご厚意で今年も開催することができました。<br>
