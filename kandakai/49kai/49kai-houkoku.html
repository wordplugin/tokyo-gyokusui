《　　第49回高高神田会　　》</h3>

<h2 class="title">獺祭の候に魚を並べて<br>
白みそ餡餅雑煮をも並べて食おう会</h2>
</div>

<div id="main">
<p style="text-align:left;">2016年(H28)2月20日 今年も香川県東京事務所のご協力により、せとうち旬彩館『かおりひめ』において恒例の神田会新年会が開かれました。<br>
今年の総会幹事学年の平成4年卒の皆さんが大挙して参加するなどして大盛況で、座る席がないほどでした。<br>
</p>
