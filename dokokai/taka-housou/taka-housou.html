<div id="main">
東京近辺に在住する高高卒業生の弁護士、裁判官、検察官、大学教授などでつくっている会です。<br>
現在、会員名簿数40数名。毎年、年末に集まり懇親会兼忘年会を開いています。<br><br>
法科大学院生、司法修習生に法律事務所の見学先を提供するなど、このネットワークを生かして、法曹を目指す人のお役に立てればと思っています。<br>
