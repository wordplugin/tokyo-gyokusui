高高の先輩である菊池寛は大の麻雀好き。負けると口をきかなくなるので「くちきかん」と言われたそうですが、その菊池寛を名前に付した麻雀同好会です。<br>
毎年2月8月に大会を実施していますので、皆さんぜひご参加ください。
