<h2 class="title">芝界隈を散歩する　2015年5月6日</h2>
</div>

<div id="main">
<p style="text-align:left;">　大江戸散歩隊では、ゴールデンウィーク最終日の2015年(H27)5月6日、ホテルオークラでの「大使、大使夫人による10か国のガーデニング」を鑑賞した後、虎ノ門・金毘羅宮、栄閑院(猿寺)、愛宕山を散歩し、「とうふ屋うかい」で昼食をとった後、増上寺、芝大神宮、旧芝離宮庭園を散歩しました。<br>
<br>
</p>
