<h2 class="title">満開の桜の下、江戸城を散歩する　2016年4月3日</h2>
</div>

<div id="main">
<p style="text-align:left;">　大江戸散歩隊では、2016年4月3日、「江戸城　お花見散歩」をしてきました。<br>
今年は、平年より5日早い3月21日に開花宣言がなされましたが、その後、寒い日が続いたため桜の開花時期が長くなり、4月3日は桜が満開で、絶好の花見日和となりました。<br>
満開の桜を堪能した後は、神保町「ろしあ亭」でロシア料理を堪能しました。
</p>
