<h2 class="title">大江戸散歩隊　水元公園で花菖蒲遠足をする</h2>

</div>

<div id="main">
<p style="text-align:left;">2016年(H28)6月11日、都内で唯一水郷の景観を持つ、葛飾区の水元公園を、弁当持参で遠足してきました。<br>

公園の中にある「はなしょうぶ園」では、約100品種20万本の花菖蒲が咲き競っていました。<br>

</p>
